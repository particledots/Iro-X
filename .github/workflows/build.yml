name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build-macos:
    runs-on: macos-26     # Apple silicon runner, same as the ELXAR-Two workflow
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal, macOS 11+)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DIROX_BUILD_PLUGIN_TEST=ON

      - name: Check the Iroi source file by file (changes must be marked and listed)
        run: |
          # Every file in the firmware folder must be identical to Befaco/Iroi at the commit named in SOURCE.txt,
          # unless that file carries the words "Iro-x change" AND is named in IROX-CHANGES.md.
          COMMIT=$(sed -n 's/^Commit: \([0-9a-f]\{40\}\).*/\1/p' third_party/iroi-firmware/SOURCE.txt)
          echo "Iroi commit named in SOURCE.txt: $COMMIT"
          [ -n "$COMMIT" ] || { echo "::error::SOURCE.txt does not name a commit"; exit 1; }
          git clone --quiet https://github.com/Befaco/Iroi /tmp/iroi-original
          git -C /tmp/iroi-original checkout --quiet "$COMMIT"
          CHANGED=0
          for f in /tmp/iroi-original/*.h /tmp/iroi-original/*.hpp /tmp/iroi-original/LICENSE; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            if ! cmp -s "$f" "third_party/iroi-firmware/$n"; then
              grep -q "Iro-x change" "third_party/iroi-firmware/$n" || { echo "::error::FIRMWARE file $n differs from Befaco/Iroi and is not marked Iro-x change"; exit 1; }
              grep -q "$n" third_party/iroi-firmware/IROX-CHANGES.md || { echo "::error::FIRMWARE file $n is changed but not listed in IROX-CHANGES.md"; exit 1; }
              echo "changed and listed: $n"; CHANGED=$((CHANGED+1))
            fi
          done
          # No extra or missing files, no marker in an unchanged file
          for f in third_party/iroi-firmware/*.h third_party/iroi-firmware/*.hpp; do
            [ -e "$f" ] || continue
            [ -e "/tmp/iroi-original/$(basename "$f")" ] || { echo "::error::FIRMWARE extra file $(basename "$f") is not in Befaco/Iroi"; exit 1; }
          done
          echo "firmware check passed ($CHANGED file(s) changed, all marked and listed)"

      - name: Engine test (the effects without a host, native and Intel)
        run: |
          # The engine test is built by the configure step above (IROX_BUILD_ENGINE_TEST defaults to ON).
          cmake --build build --target irox_engine_test -j4 > engine_test_log.txt 2>&1 || {
            grep -E "error|Error" engine_test_log.txt | head -8 | while IFS= read -r line; do echo "::error::ENGINE TEST BUILD - $line"; done
            tail -20 engine_test_log.txt; exit 1; }
          ENGINE_BIN=$(find build -type f -name irox_engine_test | head -1)
          [ -n "$ENGINE_BIN" ] || { echo "::error::ENGINE TEST program not found after the build"; exit 1; }
          lipo -archs "$ENGINE_BIN"
          mkdir -p engine-wav
          set +e
          arch -arm64 "$ENGINE_BIN" engine-wav > engine_test_result.txt 2>&1
          STATUS=$?
          set -e
          tail -25 engine_test_result.txt
          if [ $STATUS -ne 0 ] || ! grep -q "RESULT - all engine checks passed" engine_test_result.txt; then
            echo "::error::ENGINE TEST (Apple silicon) stopped with exit status $STATUS; last line - $(tail -1 engine_test_result.txt)"
            grep -i FAIL engine_test_result.txt | head -8 | while IFS= read -r line; do echo "::error::ENGINE TEST - $line"; done
            exit 1
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$ENGINE_BIN" > engine_test_result_intel.txt 2>&1 || true
            tail -2 engine_test_result_intel.txt
            grep -q "RESULT - all engine checks passed" engine_test_result_intel.txt && echo "::notice::ENGINE TEST intel (Rosetta) - all checks passed" || echo "::warning::ENGINE TEST intel (Rosetta) did not pass - $(tail -1 engine_test_result_intel.txt)"
          else
            echo "::notice::ENGINE TEST intel - Rosetta not available on this runner, skipped"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Iro-x-engine-wav
          path: engine-wav

      - name: Plugin test (the plugin code with a pretend host, saving, window picture)
        run: |
          cmake --build build --target Iro_x_PluginTest -j4 > plugin_test_log.txt 2>&1 || {
            grep -E "error|Error" plugin_test_log.txt | head -8 | while IFS= read -r line; do echo "::error::PLUGIN TEST BUILD - $line"; done
            tail -20 plugin_test_log.txt; exit 1; }
          TEST_BIN=$(find build -type f -name Iro_x_PluginTest | head -1)
          [ -n "$TEST_BIN" ] || { echo "::error::PLUGIN TEST program not found after the build"; exit 1; }
          file "$TEST_BIN"
          mkdir -p test-renders
          set +e
          arch -arm64 "$TEST_BIN" test-renders > plugin_test_result.txt 2>&1
          STATUS=$?
          set -e
          cat plugin_test_result.txt
          if [ $STATUS -ne 0 ] || ! grep -q "RESULT - all plugin checks passed" plugin_test_result.txt; then
            echo "::error::PLUGIN TEST stopped with exit status $STATUS; last line - $(tail -1 plugin_test_result.txt)"
            grep FAIL plugin_test_result.txt | while IFS= read -r line; do echo "::error::PLUGIN TEST - $line"; done
            exit 1
          fi
          # Intel half through Rosetta when available. Reported, does not stop the build.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$TEST_BIN" > plugin_test_result_intel.txt 2>&1 || true
            tail -2 plugin_test_result_intel.txt
            grep -q "RESULT - all plugin checks passed" plugin_test_result_intel.txt && echo "::notice::PLUGIN TEST intel (Rosetta) - all checks passed" || echo "::warning::PLUGIN TEST intel (Rosetta) did not pass - $(tail -1 plugin_test_result_intel.txt)"
          else
            echo "::notice::PLUGIN TEST intel - Rosetta not available on this runner, skipped"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Iro-x-test-renders
          path: test-renders

      - name: Build AU + VST3
        run: |
          # Compiler errors are also written as annotations (shown on the run page and readable through the API).
          cmake --build build --target Iro_x_AU Iro_x_VST3 -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -8 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
            tail -20 build_log.txt; exit 1; }
          tail -3 build_log.txt

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/Iro_x_artefacts/Release/AU/*.component build/Iro_x_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Iro_x_artefacts/Release/AU/*.component dist/
          cp -R build/Iro_x_artefacts/Release/VST3/*.vst3 dist/
          cp THIRD-PARTY-LICENSES.txt LICENSE README.md CHANGELOG.md dist/
          # Where the source of this exact build is (GPL: a build must come with its source).
          printf 'Iro-x source code\n\nThis build was made from commit\n  %s\nof the public repository\n  https://github.com/%s\n\nThe complete source of this build, including the Iroi firmware copy and the build script:\n  https://github.com/%s/tree/%s\n\nLicence: GNU GPL version 3, see LICENSE and THIRD-PARTY-LICENSES.txt.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/SOURCE.txt
          cat dist/SOURCE.txt
          # The version inside the plugin must be the one in CMakeLists.txt.
          WANT=$(sed -n 's/^project(Iro_x VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Iro-x.component/Contents/Info.plist)
          echo "version wanted $WANT, in the plugin $GOT"
          [ "$WANT" = "$GOT" ] || { echo "::error::PACKAGE version in the plugin is $GOT, expected $WANT"; exit 1; }
          # The Audio Unit must be an EFFECT (type aufx), so Logic lists it under Audio FX.
          AUTYPE=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:type" dist/Iro-x.component/Contents/Info.plist)
          echo "Audio Unit type: $AUTYPE"
          [ "$AUTYPE" = "aufx" ] || { echo "::error::PACKAGE Audio Unit type is $AUTYPE, expected aufx (effect)"; exit 1; }
          cp third_party/iroi-firmware/SOURCE.txt dist/SOURCE-Iroi-firmware.txt
          cp third_party/iroi-firmware/IROX-CHANGES.md dist/CHANGES-to-Iroi-firmware.md
          cp third_party/owlprogram/SOURCE.txt dist/SOURCE-OwlProgram.txt
          cp third_party/owlprogram/LICENSE dist/LICENSE-OwlProgram.txt
          # Both slices present, and the minimum macOS version baked into each (should say 11.0):
          lipo -archs dist/*.component/Contents/MacOS/*
          lipo -archs dist/*.vst3/Contents/MacOS/*
          for a in arm64 x86_64; do echo "== $a"; lipo -thin $a dist/*.component/Contents/MacOS/* -output /tmp/slice_$a; otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version"; done
          cp tools/install/Install-Iro-x.command tools/install/Uninstall-Iro-x.command dist/
          chmod +x dist/Install-Iro-x.command dist/Uninstall-Iro-x.command
          cat > dist/INSTALL.txt <<'TXT'
          EASY INSTALL (AU for Logic, plus VST3): double-click Install-Iro-x.command in this folder.
          It asks for your Mac password once. To remove: double-click Uninstall-Iro-x.command.

          Then in Logic: Settings > Plug-in Manager > Reset & Rescan Selection.
          Look for Iro-x in a track's Audio FX slot, under Audio Units > particledots.

          Manual install instead: copy Iro-x.component to /Library/Audio/Plug-Ins/Components/
          and Iro-x.vst3 to /Library/Audio/Plug-Ins/VST3/.
          If macOS says it is from an unidentified developer: Terminal, then
            xattr -dr com.apple.quarantine <the unzipped folder>
          TXT
          [ -x dist/Install-Iro-x.command ] || { echo "::error::PACKAGE missing Install-Iro-x.command"; exit 1; }
          [ -x dist/Uninstall-Iro-x.command ] || { echo "::error::PACKAGE missing Uninstall-Iro-x.command"; exit 1; }
          # The Mutable Instruments (MIT) notice must be in the download.
          grep -q "Permission is hereby granted" dist/THIRD-PARTY-LICENSES.txt || { echo "::error::PACKAGE THIRD-PARTY-LICENSES.txt lacks the MIT notice for the Mutable Instruments code"; exit 1; }
          for f in LICENSE THIRD-PARTY-LICENSES.txt SOURCE-Iroi-firmware.txt CHANGES-to-Iroi-firmware.md SOURCE-OwlProgram.txt LICENSE-OwlProgram.txt SOURCE.txt README.md; do [ -s "dist/$f" ] || { echo "::error::PACKAGE missing $f"; exit 1; }; done
          ls -la dist
          ditto -c -k --keepParent dist Iro-x-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Iro-x-macOS
          path: Iro-x-macOS.zip
